<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yojana Setu — Ultimate Scheme Portal</title>
<meta name="theme-color" content="#FF9933">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --saffron:#FF9933;--green:#138808;--blue:#000080;--bg:#F5F5F0;
  --card:#fff;--text:#1A1A1A;--muted:#666;--border:#eee;
  --card-radius:20px;--shadow-sm:0 4px 16px rgba(0,0,0,.07);
  --shadow-md:0 10px 32px rgba(0,0,0,.13);--shadow-lg:0 20px 56px rgba(0,0,0,.2);
  --transition:all .4s cubic-bezier(.2,.8,.3,1);
}
[data-theme="dark"]{
  --bg:#0F0F14;--card:#1A1A22;--text:#F0F0F0;--muted:#999;--border:#2A2A33;
  --shadow-sm:0 4px 16px rgba(0,0,0,.4);--shadow-md:0 10px 32px rgba(0,0,0,.5);
}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes urgentPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,67,54,.5)}50%{box-shadow:0 0 0 12px rgba(244,67,54,0)}}
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-200px) rotate(720deg);opacity:0}}
@keyframes ripple{to{transform:scale(4);opacity:0}}

body{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans Kannada','Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;padding-bottom:100px;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 2px 20px rgba(0,0,0,.08);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
[data-theme="dark"] .hdr{background:rgba(20,20,26,.94)}
.logo{display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:900;font-size:18px;cursor:pointer;text-decoration:none;letter-spacing:-.5px}
[data-theme="dark"] .logo{color:#8AB4F8}
.logo-ic{font-size:28px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.15))}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:16px;transition:var(--transition);display:flex;align-items:center;justify-content:center;position:relative}
.icon-btn:hover{transform:scale(1.1);border-color:var(--saffron)}
.icon-btn .badge-count{position:absolute;top:-6px;right:-6px;background:#f44336;color:#fff;font-size:10px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.lang button{padding:7px 12px;margin-left:3px;border:1.5px solid var(--border);background:var(--card);color:var(--text);border-radius:24px;cursor:pointer;font-size:12px;font-weight:800;transition:var(--transition)}
.lang button:hover{background:#fff8f0}
.lang button.on{background:linear-gradient(135deg,var(--saffron),#ff7a00);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(255,153,51,.45)}
.search-wrap{flex:1;min-width:200px;max-width:480px;position:relative}
.search-input{width:100%;padding:12px 18px 12px 44px;border:2px solid var(--border);border-radius:30px;font-size:14.5px;font-weight:600;outline:none;transition:var(--transition);background:var(--card);color:var(--text)}
.search-input:focus{border-color:var(--saffron);box-shadow:0 0 0 5px rgba(255,153,51,.15)}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;opacity:.6}

/* HERO */
.hero{background:linear-gradient(135deg,#FF9933 0%,#FF5E62 20%,#138808 50%,#0EA5E9 80%,#8B5CF6 100%);background-size:500% 500%;animation:gradientShift 20s ease infinite;color:#fff;text-align:center;padding:60px 24px 52px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 10% 20%,rgba(255,255,255,.2),transparent 40%),radial-gradient(circle at 90% 80%,rgba(255,255,255,.15),transparent 40%);pointer-events:none}
.hero h1{font-size:34px;margin-bottom:10px;font-weight:900;text-shadow:0 4px 16px rgba(0,0,0,.3);letter-spacing:-1px;position:relative}
.hero p{opacity:.98;margin-bottom:24px;font-size:16px;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.2);position:relative}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative}
.vbtn{background:rgba(255,255,255,.98);color:var(--blue);border:none;padding:15px 28px;border-radius:60px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 10px 36px rgba(0,0,0,.3);transition:var(--transition);display:inline-flex;align-items:center;gap:10px;letter-spacing:-.3px}
.vbtn:hover{transform:translateY(-5px) scale(1.05);box-shadow:0 16px 48px rgba(0,0,0,.4)}
.vbtn.alt{background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;border:2px solid rgba(255,255,255,.4)}

/* SECTIONS */
.sec{padding:32px 20px;max-width:1280px;margin:0 auto}
.sec h2{font-size:24px;margin-bottom:22px;font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--text)}
.sec h2 .badge{font-size:12px;background:linear-gradient(135deg,#f44336,#ff5252);color:#fff;padding:4px 12px;border-radius:20px;font-weight:800;animation:pulse 2s infinite}

/* URGENT BANNER */
.urgent-banner{background:linear-gradient(135deg,#fff3f3,#ffe0e0);border:2px solid #ffcdd2;border-radius:20px;padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px;animation:fadeInUp .5s ease both}
[data-theme="dark"] .urgent-banner{background:linear-gradient(135deg,#3a1a1a,#4a2020);border-color:#662222}
.urgent-banner .icon{font-size:36px;animation:urgentPulse 2s infinite}
.urgent-banner h3{font-size:17px;font-weight:900;color:#c62828;margin-bottom:4px}
[data-theme="dark"] .urgent-banner h3{color:#ff8a80}
.urgent-banner p{font-size:14px;color:#d32f2f;font-weight:600}
[data-theme="dark"] .urgent-banner p{color:#ffab91}

/* CATEGORY */
.cat-g{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:640px){.cat-g{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1024px){.cat-g{grid-template-columns:repeat(5,1fr)}}
.cat{position:relative;border-radius:var(--card-radius);padding:20px;min-height:160px;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-md);transition:var(--transition);overflow:hidden;animation:fadeInUp .5s ease both}
.cat::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.14),transparent 55%);pointer-events:none;z-index:1}
.cat-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.4;transition:opacity .6s,transform .8s}
.cat:hover{transform:translateY(-10px) scale(1.03);box-shadow:var(--shadow-lg)}
.cat:hover .cat-bg{opacity:.65;transform:scale(1.15)}
.cat .content{position:relative;z-index:2}
.cat .ic{font-size:44px;display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4));margin-bottom:8px;transition:transform .5s}
.cat:hover .ic{transform:scale(1.2) rotate(-10deg)}
.cat .nm{font-size:16px;font-weight:900;text-shadow:0 3px 10px rgba(0,0,0,.5);letter-spacing:-.3px}
.cat .cnt{font-size:12px;opacity:.95;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.4);margin-top:2px}

/* CARDS */
.sch-g{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:640px){.sch-g{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.sch-g{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;border-radius:var(--card-radius);padding:22px;color:#fff;cursor:pointer;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-md);transition:var(--transition);overflow:hidden;animation:fadeInUp .5s ease both}
.card-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.42;transition:opacity .6s,transform .8s}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 15%,rgba(0,0,0,.9) 100%);z-index:1}
.card::after{content:'';position:absolute;top:14px;right:14px;width:80px;height:80px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);border-radius:50%;pointer-events:none;z-index:1}
.card:hover{transform:translateY(-12px) scale(1.03);box-shadow:var(--shadow-lg)}
.card:hover .card-bg{opacity:.68;transform:scale(1.15)}
.card>*{position:relative;z-index:2}
.card .emoji{position:absolute;top:18px;left:18px;font-size:48px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));transition:transform .5s;z-index:2}
.card:hover .emoji{transform:scale(1.25) rotate(-14deg)}
.card h3{font-size:17px;margin-bottom:6px;font-weight:900;text-shadow:0 3px 8px rgba(0,0,0,.6);padding-left:62px;line-height:1.3}
.card p{font-size:13px;opacity:.96;text-shadow:0 2px 6px rgba(0,0,0,.6);font-weight:600}
.card .deadline-badge{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.25);backdrop-filter:blur(8px);padding:5px 12px;border-radius:22px;font-size:11px;font-weight:900;z-index:2;border:1px solid rgba(255,255,255,.35)}
.card .deadline-badge.urgent{background:linear-gradient(135deg,#f44336,#ff5252);border-color:#ff5252;animation:pulse 1.5s infinite}
.card .deadline-badge.warning{background:linear-gradient(135deg,#ff9800,#ffb74d);border-color:#ffb74d}
.card .deadline-badge.open{background:linear-gradient(135deg,#4caf50,#66bb6a);border-color:#66bb6a}
.card .bm-btn{position:absolute;top:18px;right:60px;background:rgba(255,255,255,.25);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35);padding:5px 10px;border-radius:22px;font-size:14px;cursor:pointer;z-index:3;transition:transform .3s}
.card .bm-btn:hover{transform:scale(1.15)}
.card .bm-btn.on{background:linear-gradient(135deg,#ffb300,#ff8f00);border-color:#ffb300}

/* CTA */
.cta{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,#138808,#0EA5E9,#8B5CF6);background-size:200% 200%;animation:gradientShift 8s ease infinite;color:#fff;padding:28px;border-radius:var(--card-radius);cursor:pointer;box-shadow:0 14px 44px rgba(19,136,8,.4);transition:var(--transition);position:relative;overflow:hidden}
.cta:hover{transform:translateY(-6px);box-shadow:0 20px 60px rgba(19,136,8,.55)}
.cta::before{content:'';position:absolute;top:-50%;right:-15%;width:260px;height:260px;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);pointer-events:none}
.cta h3{font-size:21px;font-weight:900;letter-spacing:-.4px}
.cta p{font-size:14px;opacity:.95;font-weight:600}

/* ELIGIBILITY */
.epg{padding:36px 20px;max-width:720px;margin:0 auto;min-height:70vh;animation:fadeInUp .5s ease}
.pbar{height:10px;background:var(--border);border-radius:5px;margin-bottom:16px;overflow:hidden}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--saffron),#FF5E62,#8B5CF6);transition:width .5s cubic-bezier(.2,.8,.3,1);border-radius:5px}
.snum{font-size:13px;color:var(--muted);margin-bottom:28px;font-weight:900;letter-spacing:.8px}
.epg h2{font-size:26px;margin-bottom:28px;font-weight:900;letter-spacing:-.6px;line-height:1.3;color:var(--text)}
.opts{display:grid;gap:14px}
.opt{padding:20px 22px;background:var(--card);border:2.5px solid var(--border);color:var(--text);border-radius:16px;font-size:16px;text-align:left;cursor:pointer;transition:var(--transition);font-weight:800;display:flex;align-items:center;gap:14px}
.opt .opt-emoji{font-size:26px;flex-shrink:0}
.opt:hover{border-color:var(--saffron);background:#fff8f0;transform:translateX(8px);box-shadow:0 10px 32px rgba(255,153,51,.25)}
[data-theme="dark"] .opt:hover{background:#252025}
.ain{width:100%;padding:20px;font-size:22px;border:2.5px solid var(--border);background:var(--card);color:var(--text);border-radius:16px;outline:none;transition:var(--transition);font-weight:800}
.ain:focus{border-color:var(--saffron);box-shadow:0 0 0 6px rgba(255,153,51,.18)}
.rlist{display:grid;gap:14px;margin-top:26px}
.ritem{display:flex;gap:16px;padding:18px;background:var(--card);border-radius:18px;cursor:pointer;box-shadow:var(--shadow-sm);transition:var(--transition);align-items:center;animation:fadeInUp .4s ease both}
.ritem:hover{transform:translateY(-5px);box-shadow:var(--shadow-md)}
.ritem .ic{font-size:38px;min-width:58px;text-align:center}
.ritem h3{font-size:15px;font-weight:900;line-height:1.3;color:var(--text)}
.ritem p{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px}
.ritem .meta{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:700}
.rbtn{margin-top:32px;padding:17px 34px;background:linear-gradient(135deg,var(--blue),#4A00E0,#8B5CF6);color:#fff;border:none;border-radius:16px;cursor:pointer;font-size:16px;font-weight:900;transition:var(--transition);box-shadow:0 10px 32px rgba(0,0,128,.35);display:block;width:fit-content;margin-left:auto;margin-right:auto}
.rbtn:hover{transform:translateY(-5px);box-shadow:0 16px 48px rgba(0,0,128,.5)}
.seemore-btn{margin:22px auto 0;padding:15px 34px;background:var(--card);border:2.5px solid var(--saffron);color:var(--saffron);border-radius:14px;cursor:pointer;font-size:15px;font-weight:900;transition:var(--transition);display:block}
.seemore-btn:hover{background:var(--saffron);color:#fff;transform:translateY(-3px);box-shadow:0 10px 28px rgba(255,153,51,.35)}

/* DETAIL */
.det{max-width:960px;margin:0 auto;padding-bottom:56px}
.dhero{min-height:280px;padding:30px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;position:relative;overflow:hidden;border-radius:0 0 28px 28px}
.dhero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.5;transition:transform .8s}
.dhero:hover .dhero-bg{transform:scale(1.08)}
.dhero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 10%,rgba(0,0,0,.92));z-index:1}
.dhero>*{position:relative;z-index:2}
.dhero .emoji{font-size:64px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.55));margin-bottom:14px}
.dhero h1{font-size:28px;margin-bottom:8px;font-weight:900;text-shadow:0 4px 12px rgba(0,0,0,.55);letter-spacing:-.6px;line-height:1.25}
.dhero .hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);padding:7px 16px;border-radius:28px;font-size:12.5px;font-weight:900;border:1px solid rgba(255,255,255,.3);margin-bottom:12px;width:fit-content}
.dhero p{font-size:16px;opacity:.98;text-shadow:0 3px 10px rgba(0,0,0,.55);font-weight:600}

.box{padding:24px;background:var(--card);margin:16px 20px;border-radius:var(--card-radius);box-shadow:var(--shadow-sm);animation:fadeInUp .5s ease both;transition:box-shadow .3s;color:var(--text)}
.box:hover{box-shadow:var(--shadow-md)}
.box h2{font-size:19px;margin-bottom:16px;font-weight:900;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;color:var(--text)}
.box-b{border-left:6px solid var(--green);background:linear-gradient(135deg,var(--card),#f1f8e9)}
[data-theme="dark"] .box-b{background:linear-gradient(135deg,#1A2A1A,#1A2A1A)}
.bamt{font-size:20px;font-weight:900;color:var(--green);margin-bottom:14px;line-height:1.5}
[data-theme="dark"] .bamt{color:#7cd67c}
.deadline-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.deadline-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:26px;font-size:13px;font-weight:900}
.deadline-pill.start{background:#e8f5e9;color:#2e7d32;border:1.5px solid #c8e6c9}
.deadline-pill.end{background:#fff3e0;color:#e65100;border:1.5px solid #ffe0b2}
.deadline-pill.end.urgent{background:linear-gradient(135deg,#ffebee,#ffcdd2);color:#c62828;border-color:#ef9a9a;animation:pulse 1.5s infinite}
.deadline-pill.open{background:#e3f2fd;color:#1565c0;border:1.5px solid #bbdefb}
.lbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:var(--border);border:none;border-radius:26px;cursor:pointer;font-size:13px;font-weight:900;transition:var(--transition);color:var(--text);text-decoration:none}
.lbtn:hover{background:var(--saffron);color:#fff;transform:scale(1.06)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.dlist{display:grid;gap:12px}
.ditem{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--bg);border-radius:14px;cursor:pointer;transition:var(--transition);font-weight:800;border:2.5px solid transparent;font-size:14.5px;color:var(--text)}
.ditem:hover{background:#fff8f0;border-color:var(--saffron);transform:translateX(6px)}
[data-theme="dark"] .ditem:hover{background:#252025}
.ditem.done{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);text-decoration:line-through;opacity:.75;color:#1a3a1a}
.ditem input{width:24px;height:24px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
.ditem .doc-icon{font-size:22px;flex-shrink:0}
.slist{list-style:none;counter-reset:s}
.slist li{display:flex;align-items:flex-start;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
.slist li:last-child{border:none}
.stepn{min-width:36px;height:36px;background:linear-gradient(135deg,var(--saffron),#FF5E62);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;box-shadow:0 5px 14px rgba(255,153,51,.45);flex-shrink:0}
.abtn{display:flex;align-items:center;justify-content:center;gap:12px;padding:20px;background:linear-gradient(135deg,#138808,#0EA5E9);color:#fff;border-radius:16px;text-decoration:none;font-weight:900;font-size:18px;transition:var(--transition);box-shadow:0 12px 36px rgba(19,136,8,.4)}
.abtn:hover{transform:translateY(-5px);box-shadow:0 18px 52px rgba(19,136,8,.6)}
.hlp{margin-top:16px;text-align:center;color:var(--muted);font-size:14px;font-weight:800}
.blink{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;color:var(--blue);cursor:pointer;font-weight:900;background:var(--card);border:none;font-size:15px;border-radius:14px;transition:var(--transition);margin:8px 0;box-shadow:var(--shadow-sm)}
[data-theme="dark"] .blink{color:#8AB4F8}
.blink:hover{transform:translateX(-5px);box-shadow:var(--shadow-md)}

/* INLINE MINI ELIGIBILITY */
.mini-elig{background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border:2px solid #c8e6c9;border-radius:16px;padding:18px;margin-top:14px}
[data-theme="dark"] .mini-elig{background:linear-gradient(135deg,#1A2A1A,#1A2A1A);border-color:#2A4A2A}
.mini-elig h3{font-size:16px;font-weight:900;color:#1b5e20;margin-bottom:14px}
[data-theme="dark"] .mini-elig h3{color:#7cd67c}
.mini-q{margin-bottom:12px;padding:12px;background:var(--card);border-radius:12px;box-shadow:var(--shadow-sm)}
.mini-q .q-text{font-size:14px;font-weight:800;margin-bottom:10px;color:var(--text)}
.mini-q .q-opts{display:flex;gap:8px}
.mini-q .q-opt{flex:1;padding:10px;background:var(--bg);border:2px solid var(--border);border-radius:10px;cursor:pointer;font-weight:800;font-size:13px;transition:var(--transition);color:var(--text)}
.mini-q .q-opt:hover{border-color:var(--saffron)}
.mini-q .q-opt.sel{background:var(--saffron);color:#fff;border-color:var(--saffron)}

/* SCAM WARNING */
.scam-warn{background:linear-gradient(135deg,#fff8e1,#ffecb3);border:2px solid #ffd54f;border-radius:14px;padding:16px;margin-top:14px;display:flex;gap:12px;align-items:flex-start}
[data-theme="dark"] .scam-warn{background:linear-gradient(135deg,#3a2f1a,#3a2f1a);border-color:#6a5a2a}
.scam-warn .w-ic{font-size:24px;flex-shrink:0}
.scam-warn h4{font-size:14px;font-weight:900;color:#e65100;margin-bottom:4px}
[data-theme="dark"] .scam-warn h4{color:#ffb74d}
.scam-warn p{font-size:13px;color:#ef6c00;font-weight:600}
[data-theme="dark"] .scam-warn p{color:#ffcc80}

/* SUCCESS STORIES */
.stories{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:640px){.stories{grid-template-columns:repeat(2,1fr)}}
.story{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm);display:flex;gap:14px;align-items:flex-start;transition:var(--transition)}
.story:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.story .avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--saffron),#FF5E62);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:900;flex-shrink:0}
.story .content h4{font-size:14px;font-weight:900;color:var(--text);margin-bottom:4px}
.story .content p{font-size:13px;color:var(--muted);font-weight:600;font-style:italic;line-height:1.5}
.story .content .meta{font-size:11.5px;color:var(--saffron);font-weight:900;margin-top:6px}

/* QR CODE */
.qr-section{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:16px;background:var(--bg);border-radius:14px;margin-top:14px}
.qr-img{background:#fff;padding:10px;border-radius:12px;box-shadow:var(--shadow-sm)}
.qr-img img{display:block;width:140px;height:140px}
.qr-info h4{font-size:14px;font-weight:900;color:var(--text);margin-bottom:6px}
.qr-info p{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.5}

/* FEEDBACK / RATING */
.rating{display:flex;gap:8px;margin-top:10px}
.star{font-size:28px;cursor:pointer;transition:transform .2s;filter:grayscale(1) opacity(.4)}
.star:hover,.star.on{filter:grayscale(0) opacity(1);transform:scale(1.15)}

/* BUDGET CALC */
.budget-card{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:24px;border-radius:20px;box-shadow:var(--shadow-md);text-align:center;margin-bottom:24px}
.budget-card h3{font-size:18px;margin-bottom:12px;font-weight:900}
.budget-card .big-amount{font-size:42px;font-weight:900;text-shadow:0 4px 12px rgba(0,0,0,.3);margin-bottom:6px}
.budget-card p{opacity:.95;font-size:14px;font-weight:600}

/* COMPARE */
.compare-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:14px 24px;border-radius:50px;display:flex;gap:16px;align-items:center;box-shadow:0 10px 32px rgba(0,0,128,.4);z-index:90;animation:pop .3s ease}
.compare-bar button{background:#fff;color:var(--blue);border:none;padding:8px 16px;border-radius:24px;font-weight:900;cursor:pointer}
.compare-grid{display:grid;gap:16px;margin-top:20px}
.compare-row{display:grid;gap:12px;grid-template-columns:140px repeat(auto-fit, minmax(180px, 1fr));padding:14px;background:var(--card);border-radius:12px}
.compare-row .label{font-weight:900;color:var(--muted);font-size:13px}

/* MY APPS */
.app-status{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:900}
.app-status.pending{background:#fff3e0;color:#e65100}
.app-status.applied{background:#e3f2fd;color:#1565c0}
.app-status.approved{background:#e8f5e9;color:#2e7d32}
.app-status.rejected{background:#ffebee;color:#c62828}

/* ONBOARDING */
.onboard-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:pop .4s ease}
.onboard-card{background:var(--card);border-radius:24px;padding:32px;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.onboard-card .o-ic{font-size:60px;margin-bottom:16px}
.onboard-card h3{font-size:22px;font-weight:900;margin-bottom:10px;color:var(--text)}
.onboard-card p{color:var(--muted);font-size:15px;margin-bottom:24px;line-height:1.6}
.onboard-card .o-nav{display:flex;justify-content:space-between;align-items:center;gap:12px}
.onboard-card button{padding:12px 24px;border-radius:14px;font-weight:900;font-size:15px;cursor:pointer;border:none;transition:var(--transition)}
.onboard-card .skip{background:transparent;color:var(--muted)}
.onboard-card .next{background:linear-gradient(135deg,var(--saffron),#ff7a00);color:#fff;box-shadow:0 8px 24px rgba(255,153,51,.4)}
.onboard-dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
.onboard-dots span{width:8px;height:8px;border-radius:50%;background:var(--border)}
.onboard-dots span.on{background:var(--saffron);width:24px;border-radius:4px}

/* SKELETON */
.skeleton{background:linear-gradient(90deg,var(--border) 25%,#e8e8e8 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px}

/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px}
.empty-state .e-ic{font-size:72px;margin-bottom:16px;opacity:.6}
.empty-state h3{font-size:20px;font-weight:900;margin-bottom:10px;color:var(--text)}
.empty-state p{color:var(--muted);font-size:14px;margin-bottom:20px}
.empty-suggests{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.empty-suggests button{padding:8px 16px;background:var(--card);border:2px solid var(--border);color:var(--text);border-radius:20px;font-weight:800;cursor:pointer;font-size:13px;transition:var(--transition)}
.empty-suggests button:hover{border-color:var(--saffron);background:#fff8f0}

/* CHATBOT */
.cfab{position:fixed;bottom:26px;right:26px;z-index:200;width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--saffron),#FF5E62,#8B5CF6);background-size:200% 200%;animation:float 3.5s ease-in-out infinite,gradientShift 6s ease infinite;color:#fff;border:none;box-shadow:0 14px 44px rgba(255,153,51,.55);cursor:pointer;font-size:30px;display:flex;align-items:center;justify-content:center;transition:transform .3s}
.cfab:hover{transform:scale(1.15);animation-play-state:paused}
.cwin{position:fixed;bottom:110px;right:26px;z-index:200;width:420px;max-width:calc(100vw - 40px);height:600px;max-height:calc(100vh - 150px);background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 28px 84px rgba(0,0,0,.35);display:flex;flex-direction:column;animation:pop .4s cubic-bezier(.2,.8,.3,1)}
.chead{padding:18px 22px;background:linear-gradient(135deg,var(--blue),#4A00E0,#8B5CF6);color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:17px}
.chead button{background:rgba(255,255,255,.18);border:none;color:#fff;cursor:pointer;font-size:16px;padding:8px 14px;border-radius:12px;font-weight:800}
.cbody{flex:1;overflow-y:auto;padding:18px;background:var(--bg);display:flex;flex-direction:column;gap:14px}
.cbody::-webkit-scrollbar{width:6px}
.cbody::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.msg{display:flex;flex-direction:column;animation:slideIn .35s ease both}
.msg.u{align-items:flex-end}
.msg.b{align-items:flex-start}
.bub{max-width:88%;padding:14px 18px;border-radius:18px;font-size:14.5px;white-space:pre-wrap;line-height:1.6;word-wrap:break-word;font-weight:600}
.msg.u .bub{background:linear-gradient(135deg,var(--saffron),#FF5E62);color:#fff;border-bottom-right-radius:4px}
.msg.b .bub{background:var(--card);color:var(--text);border-bottom-left-radius:4px;box-shadow:var(--shadow-sm)}
.clink{display:block;margin-top:10px;padding:12px 16px;background:linear-gradient(135deg,#e3f2fd,#bbdefb);color:var(--blue);border-radius:12px;text-decoration:none;font-size:13.5px;font-weight:900;cursor:pointer;transition:var(--transition)}
.clink:hover{transform:translateX(5px)}
.cin{display:flex;gap:10px;padding:14px;background:var(--card);border-top:1.5px solid var(--border)}
.cin input{flex:1;padding:14px 20px;border:2.5px solid var(--border);border-radius:30px;font-size:15px;outline:none;font-weight:700;background:var(--bg);color:var(--text)}
.cin input:focus{border-color:var(--saffron);box-shadow:0 0 0 6px rgba(255,153,51,.18)}
.cin button{width:50px;height:50px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--saffron),#FF5E62);color:#fff;cursor:pointer;font-size:18px;transition:var(--transition);display:flex;align-items:center;justify-content:center}
.cin button:hover{transform:scale(1.15)}

/* CONFETTI */
.confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:300;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;opacity:0;animation:confetti 2s ease-out forwards}

@media(max-width:640px){
  .cwin{width:calc(100vw - 20px);right:10px;bottom:100px;height:74vh}
  .hero h1{font-size:24px}
  .dhero h1{font-size:21px}
  .dhero .emoji{font-size:50px}
  .cfab{width:60px;height:60px;font-size:26px;bottom:18px;right:18px}
  .sec h2{font-size:20px}
  .search-wrap{order:3;max-width:100%;flex-basis:100%}
  .compare-bar{width:calc(100vw - 40px);justify-content:center}
}

@media print{
  .hdr,.cfab,.vbtn,.blink,.abtn,.lbtn,.btn-row,.chatbot,.cin,.chead,.seemore-btn,.compare-bar,.icon-btn,.lang{display:none !important}
  .box{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}
  .dhero{min-height:auto;background:#f0f0f0 !important;color:#000}
  .dhero h1,.dhero p{color:#000;text-shadow:none}
  body{background:#fff;color:#000}
}

const TODAY=new Date();

function daysLeft(endDate){
  if(endDate==="Open All Year")return 9999;
  try{
    const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    let end;
    if(endDate.includes(':')){
      const parts=endDate.split(',')[0].split(' ');
      const m=months[parts[parts.length-2]];
      const d=parseInt(parts[parts.length-1]);
      end=new Date(2026,m,d);
    }else{
      const parts=endDate.split(' ');
      end=new Date(parseInt(parts[2]),months[parts[0]],parseInt(parts[1].replace(',','')));
    }
    return Math.ceil((end-TODAY)/(1000*60*60*24));
  }catch(e){return 9999;}
}

function getDeadlineBadge(endDate){
  const days=daysLeft(endDate);
  if(days===9999)return{cls:'open',text:'♾️'};
  if(days<0)return{cls:'urgent',text:'Expired'};
  if(days<=9)return{cls:'urgent',text:`⚠️ ${days}d`};
  if(days<=30)return{cls:'warning',text:`📅 ${days}d`};
  return{cls:'open',text:`${days}d`};
}

/* ═══════ SEARCH ═══════ */
function onSearch(val){
  SEARCH_QUERY=val.trim().toLowerCase();
  SHOW_ALL_RESULTS=false;
  VIEW='search';
  render();
  const inp=document.getElementById('searchInput');
  if(inp&&document.activeElement!==inp)inp.focus();
}
function getSearchResults(){
  if(!SEARCH_QUERY)return[];
  const q=SEARCH_QUERY;
  return S.filter(s=>{
    const nameEN=s[5][0].toLowerCase(),nameKN=s[5][1].toLowerCase(),nameHI=s[5][2].toLowerCase();
    const benefit=s[6].join(' ').toLowerCase();
    const id=s[0].toLowerCase(),cat=s[1].toLowerCase();
    const cInfo=C.find(c=>c.id===cat);
    const catName=cInfo?cInfo.n.join(' ').toLowerCase():'';
    return nameEN.includes(q)||nameKN.includes(q)||nameHI.includes(q)||id.includes(q)||benefit.includes(q)||catName.includes(q);
  });
}
function clearSearch(){
  SEARCH_QUERY='';SHOW_ALL_RESULTS=false;
  const inp=document.getElementById('searchInput');if(inp)inp.value='';
  go('home');
}

/* ═══════ RENDER ═══════ */
function render(){
  const v=document.getElementById('view');
  document.getElementById('logoText').textContent=t('appName');
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  const inp=document.getElementById('searchInput');if(inp)inp.placeholder=t('searchPlaceholder');
  updateBmCount();
  if(VIEW==='search')renderSearch(v);
  else if(VIEW==='home')renderHome(v);
  else if(VIEW==='list')renderList(v);
  else if(VIEW==='detail')renderDetail(v);
  else if(VIEW==='elig')renderElig();
  else if(VIEW==='bookmarks')renderBookmarks(v);
}

function voiceSearch(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Voice works in Chrome only');return;}
  const r=new SR();
  r.lang=LANG==='kn'?'kn-IN':LANG==='hi'?'hi-IN':'en-IN';
  r.onresult=e=>{const q=e.results[0][0].transcript;document.getElementById('searchInput').value=q;onSearch(q);};
  r.start();
}
function speak(txt){
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=LANG==='kn'?'kn-IN':LANG==='hi'?'hi-IN':'en-IN';
  speechSynthesis.cancel();speechSynthesis.speak(u);
}

/* ═══════ CONFETTI ═══════ */
function confetti(){
  const colors=['#FF9933','#138808','#0EA5E9','#8B5CF6','#FF5E62','#FFD700'];
  const container=document.createElement('div');
  container.className='confetti';
  for(let i=0;i<50;i++){
    const piece=document.createElement('div');
    piece.className='confetti-piece';
    piece.style.left=Math.random()*100+'%';
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDelay=Math.random()*0.3+'s';
    container.appendChild(piece);
  }
  document.body.appendChild(container);
  setTimeout(()=>container.remove(),2500);
}

/* ═══════ CSV EXPORT ═══════ */
function exportCSV(){
  const rows=[['ID','Name (EN)','Category','Benefit (EN)','Eligibility','Deadline','Link']];
  S.forEach(s=>rows.push([s[0],s[5][0],s[1],s[6][0],s[7][0],s[11],s[2]]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='yojana-setu-schemes.csv';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}

function ans(val){
  EAns[QS[EStep].k]=val;
  if(EStep<QS.length-1){EStep++;renderElig();}
  else{computeElig();renderEligResult();confetti();}
}
function computeElig(){
  const E=EResult=[];
  const incomeMap={'below1L':100000,'1-2.5L':250000,'2.5-5L':500000,'5-8L':800000,'above8L':1000000};
  const userIncome=incomeMap[EAns.income]||0;
  const userAge=parseInt(EAns.age)||0;
  const userLand=parseFloat(EAns.land)||0;
  S.forEach(s=>{
    let ok=true;const cat=s[1];const id=s[0];
    if(cat==='agriculture'&&EAns.occupation!=='farmer'&&userLand<0.1)ok=false;
    if(cat==='sc-st'&&!['SC','ST'].includes(EAns.caste))ok=false;
    if(cat==='obc-minority'&&!['Minority','Cat-1','Cat-2A','Cat-2B','Cat-3A','Cat-3B'].includes(EAns.caste))ok=false;
    if(cat==='education'&&EAns.student!=='Yes')ok=false;
    if(cat==='karnataka'&&EAns.state!=='Karnataka')ok=false;
    if(cat==='health'&&EAns.bpl!=='Yes'&&userIncome>200000&&!['SC','ST'].includes(EAns.caste))ok=false;
    if(cat==='housing'&&EAns.bpl!=='Yes'&&userIncome>300000)ok=false;
    if(cat==='women-child'&&EAns.gender!=='female')ok=false;
    if(cat==='pension'&&userAge<60&&EAns.marital!=='widow')ok=false;
    if(id==='apy'&&(userAge<18||userAge>40))ok=false;
    if(id==='pmjjby'&&(userAge<18||userAge>50))ok=false;
    if(id==='pmsby'&&(userAge<18||userAge>70))ok=false;
    if(id==='sandhya-suraksha'&&userAge<65)ok=false;
    if(id==='ssy'&&userAge>10)ok=false;
    if(id==='shakti'&&EAns.gender!=='female')ok=false;
    if(id==='gruha-lakshmi'&&EAns.gender!=='female')ok=false;
    if(id==='karnataka-widow'&&EAns.marital!=='widow')ok=false;
    if(id==='jsy'&&EAns.gender!=='female')ok=false;
    if(id==='pm-usp'&&userIncome>450000)ok=false;
    if(id==='post-matric-sc'&&userIncome>250000)ok=false;
    if(id==='post-matric-obc'&&userIncome>250000)ok=false;
    if(id==='nmmss'&&userIncome>350000)ok=false;
    if(id==='deepika'&&userIncome>250000)ok=false;
    if(ok)E.push(s);
  });
  E.sort((a,b)=>{
    const da=daysLeft(a[11]),db=daysLeft(b[11]);
    if(da>=0&&da<=30&&!(db>=0&&db<=30))return-1;
    if(db>=0&&db<=30&&!(da>=0&&da<=30))return 1;
    return (b[4]||0)-(a[4]||0);
  });
}
function renderEligResult(){
  const v=document.getElementById('view');

  v.innerHTML=`<div class="epg">
    <button class="blink" onclick="EResult=null;EStep=QS.length-1;EShowAll=false;renderElig()">← ${t('back')}</button>
    <div class="budget-card">

      <div class="big-amount">₹${totalBenefit.toLocaleString('en-IN')}</div>
      <p>${t('budgetNote')} · Over 5 years: ₹${(totalBenefit*5).toLocaleString('en-IN')}</p>
    </div>

  </div>`;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function chatSend(txt){
  if(!txt.trim())return;
  CHAT.push({u:1,txt});
  document.getElementById('cinput').value='';
  setTimeout(()=>{const r=botReply(txt);CHAT.push(r);renderChat();},300);
  renderChat();
}
function chatVoice(){

      "ನಿಮ್ಮ ಅರ್ಹತೆ ತಿಳಿಯಲು:\n\n1️⃣ 'ಅರ್ಹತೆ ಪರಿಶೀಲಿಸಿ' ಒತ್ತಿ\n2️⃣ 11 ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ\n3️⃣ ಯೋಜನೆಗಳ ಪಟ್ಟಿ ಪಡೆಯಿರಿ\n\nಅಥವಾ ಹೇಳಿ:\n• 'ನಾನು ರೈತ'\n• 'ನಾನು ವಿದ್ಯಾರ್ಥಿ'",
      "पात्रता जानने के लिए:\n\n1️⃣ 'अपनी पात्रता जांचें' दबाएं\n2️⃣ 11 सवालों के जवाब दें\n3️⃣ योजनाओं की सूची पाएं\n\nया बताएं:\n• 'मैं किसान हूं'\n• 'मैं छात्र हूं'") };
  }

  // Fallback
  return { txt: g(
    "I couldn't find a match. 🤔\n\nTry:\n• 'PM-KISAN'\n• 'documents for Ayushman'\n• 'farmer schemes'\n• 'education scholarships'\n• 'Karnataka schemes'\n• 'SC/ST schemes'\n\nOr type 'help' for full list.",
    "ಹೊಂದಾಣಿಕೆ ಸಿಗಲಿಲ್ಲ. 🤔\n\nಪ್ರಯತ್ನಿಸಿ:\n• 'ಪಿಎಂ-ಕಿಸಾನ್'\n• 'ಆಯುಷ್ಮಾನ್ ದಾಖಲೆ'\n• 'ರೈತ ಯೋಜನೆ'\n• 'ಶಿಕ್ಷಣ'\n\n'help' ಟೈಪ್ ಮಾಡಿ.",
    "मेल नहीं मिला। 🤔\n\nप्रयास करें:\n• 'पीएम-किसान'\n• 'आयुष्मान दस्तावेज'\n• 'किसान योजना'\n• 'शिक्षा'\n\n'help' टाइप करें।") };
}
function findSchemeByWords(low){
  const uw=low.split(/\s+/).filter(w=>w.length>=3);
  for(const s of S){
    const idParts=s[0].split('-').filter(w=>w.length>=3);
    const nameEN=s[5][0].toLowerCase();
    const nameParts=nameEN.split(/[\s-]+/).filter(w=>w.length>=3);
    if(idParts.some(w=>uw.includes(w)))return s;
    if(nameParts.some(w=>uw.includes(w)))return s;
    if(low.includes(s[5][1].toLowerCase())||low.includes(s[5][2].toLowerCase()))return s;
  }
  return null;
}

/* ═══════ ONBOARDING ═══════ */
const ONBOARD_STEPS=[
{ic:"👋",title:"Welcome to Yojana Setu",txt:"India's most comprehensive government scheme portal with 120+ schemes in 3 languages."},
{ic:"🔍",title:"Search or Browse",txt:"Use the search bar or tap any category. Found 120+ schemes across 10 categories."},
{ic:"✅",title:"Check Eligibility",txt:"Answer 11 quick questions. Get personalized list + total benefit amount."},
{ic:"⭐",title:"Save & Track",txt:"Tap ⭐ to bookmark schemes. Track your applications (Pending → Applied → Approved)."},
{ic:"📱",title:"Share & Scan",txt:"Every scheme has a QR code and WhatsApp share button. Perfect for rural outreach."}
];
let onboardIdx=0;
function showOnboarding(){
  if(localStorage.getItem('ys_onboard')==='done')return;
  const overlay=document.createElement('div');
  overlay.className='onboard-overlay';
  overlay.id='onboardOverlay';
  overlay.innerHTML=`<div class="onboard-card">
    <div class="onboard-dots">${ONBOARD_STEPS.map((_,i)=>`<span class="${i===onboardIdx?'on':''}"></span>`).join('')}</div>
    <div class="o-ic">${ONBOARD_STEPS[onboardIdx].ic}</div>
    <h3>${ONBOARD_STEPS[onboardIdx].title}</h3>
    <p>${ONBOARD_STEPS[onboardIdx].txt}</p>
    <div class="o-nav">
      <button class="skip" onclick="skipOnboard()">Skip</button>
      <button class="next" onclick="nextOnboard()">${onboardIdx===ONBOARD_STEPS.length-1?'Get Started →':'Next →'}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}
function nextOnboard(){
  onboardIdx++;
  if(onboardIdx>=ONBOARD_STEPS.length){skipOnboard();return;}
  document.getElementById('onboardOverlay').innerHTML=`<div class="onboard-card">
    <div class="onboard-dots">${ONBOARD_STEPS.map((_,i)=>`<span class="${i===onboardIdx?'on':''}"></span>`).join('')}</div>
    <div class="o-ic">${ONBOARD_STEPS[onboardIdx].ic}</div>
    <h3>${ONBOARD_STEPS[onboardIdx].title}</h3>
    <p>${ONBOARD_STEPS[onboardIdx].txt}</p>
    <div class="o-nav">
      <button class="skip" onclick="skipOnboard()">Skip</button>
      <button class="next" onclick="nextOnboard()">${onboardIdx===ONBOARD_STEPS.length-1?'Get Started →':'Next →'}</button>
    </div>
  </div>`;
}
function skipOnboard(){
  localStorage.setItem('ys_onboard','done');
  document.getElementById('onboardOverlay')?.remove();
}
